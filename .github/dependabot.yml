version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # TypeScript queda fijado en 6.0.3: la 7.x no expone la API clásica del
    # compilador que usa scripts/sin-any.ts (ADR 0002). @types/node sigue la
    # versión de Node que fija el proyecto (24, ver .nvmrc). vitest queda
    # fijado en 4.1.11: @stryker-mutator/vitest-runner (F0-17) no activa los
    # mutantes bajo vitest 5.x (ADR 0017); subirlo exige repetir la
    # comprobación manual del ADR antes de sacar este ignore. Subir de major
    # en cualquiera de los tres es una decisión aparte.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # La imagen base del Dockerfile está fijada por digest (F0-07): Dependabot
  # sube tag y digest juntos, como hace con el SHA de las acciones.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # La imagen node queda fijada en Node 24 (ver .nvmrc). Subir de major es
    # una decisión aparte.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Las imágenes de `docker-compose.yml` también van fijadas por digest
  # (Postgres en los servicios `postgres` y `postgres-e2e`, MinIO). Dependabot
  # sube tag y digest de esos dos servicios de Postgres; la tercera copia
  # (`services` de `.github/workflows/ci.yml`) la cambia una persona, y
  # `tests/dominio/imagen-postgres.test.ts` falla si no coinciden (M-06).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    # Postgres queda en 16.x (las migraciones y el drift se prueban contra esa
    # versión) y node en Node 24, igual que en el ecosistema `docker`. Subir de
    # major en cualquiera de los dos es una decisión aparte.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
