# Portón de CI (F0-05). Decisiones y porqués: docs/adr/0006-porton-ci.md.
# El control de migraciones y drift (F0-11) tiene el suyo: docs/adr/0011-drift-de-esquema-en-ci.md.
#
# Un solo job, `ci`: es el nombre del check que la protección de `main`
# exige en verde (F0-06). Queda en rojo si falla cualquier control.
#
# - Corre en cada push y en cada pull_request, sin filtro de ramas.
# - `timeout-minutes: 10` es P9: la corrida entera tiene que entrar en 10
#   minutos; si se pasa, GitHub la corta y el check queda en rojo.
# - Los controles corren todos aunque falle uno (así se ven todos los rojos
#   de una vez), pero cualquier paso que falle pone el job en rojo. No hay
#   `continue-on-error` en ningún paso.
# - Acciones fijadas por SHA de commit completo, con el tag en el comentario.
#   Dependabot (`github-actions`) propone las subidas.

name: ci

on:
  push:
  pull_request:

# Base de solo lectura. El job de la imagen (F0-07) eleva `packages: write`
# en su propio bloque; ningún otro lo necesita.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    # Postgres para el paso de `drift` (F0-11): un service container aparte
    # del Testcontainers que crea y borra `tests/casos-uso/migraciones.test.ts`
    # dentro del paso `test` (ese no deja nada vivo para los pasos
    # siguientes). Mismo tag y digest que `docker-compose.yml`: si se sube la
    # imagen de compose, actualizar acá también.
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: seism
          POSTGRES_PASSWORD: seism_local
          POSTGRES_DB: seism_gestion
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready --username=seism --dbname=seism_gestion"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      # Historial completo: gitleaks recorre los commits nuevos, no solo el
      # último árbol. Sin credenciales guardadas en .git/config: ningún
      # paso posterior las necesita.
      - name: Código
        id: codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Node de .nvmrc; caché de ~/.npm con clave en package-lock.json.
      # node_modules no se cachea: `npm ci` lo borra y lo arma de cero.
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dependencias (npm ci)
        id: dependencias
        run: npm ci

      - name: typecheck
        if: ${{ !cancelled() && steps.dependencias.outcome == 'success' }}
        run: npm run typecheck

      - name: typecheck:fixtures
        if: ${{ !cancelled() && steps.dependencias.outcome == 'success' }}
        run: npm run typecheck:fixtures

      - name: lint
        if: ${{ !cancelled() && steps.dependencias.outcome == 'success' }}
        run: npm run lint

      - name: lint:fixtures
        if: ${{ !cancelled() && steps.dependencias.outcome == 'success' }}
        run: npm run lint:fixtures

      - name: limites
        if: ${{ !cancelled() && steps.dependencias.outcome == 'success' }}
        run: npm run limites

      - name: limites:fixtures
        if: ${{ !cancelled() && steps.dependencias.outcome == 'success' }}
        run: npm run limites:fixtures

      # F0-14: la tanda de dominio sola, con su reloj. `scripts/test-dominio.ts`
      # sale 1 si tarda más de 10 s (criterio de F0-14): el nivel dominio no
      # habla con nada, y si empieza a esperar es que se llevó algo que va en
      # `tests/casos-uso/`. Corre antes que `test` porque es el más barato.
      - name: test:dominio
        if: ${{ !cancelled() && steps.dependencias.outcome == 'success' }}
        run: npm run test:dominio

      - name: test
        if: ${{ !cancelled() && steps.dependencias.outcome == 'success' }}
        run: npm test

      # El cuarto nivel que no entra en `npm test` (F0-14): golden files. Hoy
      # es el test de humo del nivel; el arnés llega en F0-16.
      - name: test:extraccion
        if: ${{ !cancelled() && steps.dependencias.outcome == 'success' }}
        run: npm run test:extraccion

      # F0-11 (cimiento 2): "un cambio de esquema sin su migración pone la
      # corrida en rojo". Aplica las migraciones existentes contra el
      # Postgres del `services:` de arriba (nunca la base de compose ni la
      # de Testcontainers del paso `test`), para poder comparar el estado
      # resultante con `schema.prisma` en el paso `drift`.
      - name: Migrar (para el paso de drift)
        id: migrar-drift
        if: ${{ !cancelled() && steps.dependencias.outcome == 'success' }}
        env:
          APP_ENTORNO: ci
          DATABASE_URL: postgresql://seism:seism_local@localhost:5432/seism_gestion
          ADMIN_INICIAL_EMAIL: admin@ejemplo.test
        run: npm run db:migrate

      # `prisma migrate diff --exit-code` entre la base recién migrada y
      # `schema.prisma`: sale 0 sin diferencia, 2 con diferencia, 1 si la
      # propia herramienta falló (docs/adr/0011-drift-de-esquema-en-ci.md).
      # Prisma 7.10 no tiene `--from-migrations --to-schema-datamodel` (eran
      # de Prisma 5/6): `--from-migrations` sigue existiendo pero pide una
      # shadow database (`datasource.shadowDatabaseUrl`), una dependencia
      # nueva que el plan no habilita para esto. `--from-config-datasource`
      # compara la base ya migrada de arriba con el esquema: mismo resultado,
      # sin nada nuevo que instalar ni configurar.
      - name: drift
        if: ${{ !cancelled() && steps.migrar-drift.outcome == 'success' }}
        env:
          DATABASE_URL: postgresql://seism:seism_local@localhost:5432/seism_gestion
        run: |
          set +e
          node node_modules/prisma/build/index.js migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code
          codigo=$?
          set -e
          if [ "$codigo" -eq 2 ]; then
            echo "::error::hay un cambio en \`schema.prisma\` sin migración"
            exit 1
          elif [ "$codigo" -ne 0 ]; then
            echo "::error::prisma migrate diff falló (código $codigo); ver el log de arriba"
            exit 1
          fi

      # Sin .env: compilar no valida el entorno. La versión del latido sale
      # del SHA de git del checkout (ADR 0005).
      - name: build
        if: ${{ !cancelled() && steps.dependencias.outcome == 'success' }}
        run: npm run build

      # La imagen Docker (F0-07) se construye y se prueba acá: en la máquina
      # de Eduardo, Docker no corre (RUNBOOK, sección 14). El runner de Ubuntu
      # trae Docker. Los dos pasos dependen del checkout y no de `npm ci`: la
      # app se compila adentro de la imagen, no en el runner.
      - name: imagen
        id: imagen
        if: ${{ !cancelled() && steps.codigo.outcome == 'success' }}
        run: npm run imagen

      # Levanta el contenedor, espera el HEALTHCHECK, pide `/` y `/api/salud`,
      # compara la versión con el SHA del commit, verifica que la imagen no se
      # haya llevado ningún `.env` y que entre en el tope de tamaño.
      - name: imagen:prueba
        if: ${{ !cancelled() && steps.imagen.outcome == 'success' }}
        run: npm run imagen:prueba

      # El navegador del e2e (F0-14). Solo Chromium, y cacheado entre corridas:
      # el paquete pesa unos 170 MB y bajarlo en cada corrida se come parte del
      # tope de 10 minutos (P9). Con la caché tibia, el paso siguiente no
      # descarga nada; las librerías del sistema (`--with-deps`) no se cachean,
      # pero el runner ya trae casi todas. La clave lleva el hash del
      # `package-lock.json`: subir la versión de Playwright trae una caché nueva.
      - name: Caché del navegador del e2e
        if: ${{ !cancelled() && steps.dependencias.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Navegador del e2e (Chromium)
        id: navegador
        if: ${{ !cancelled() && steps.dependencias.outcome == 'success' }}
        run: npx playwright install --with-deps chromium

      # F0-14: el camino de humo con navegador contra la app levantada con
      # compose (`npm run e2e:app` reusa la imagen que acaba de construir el
      # paso `imagen`, con la caché de capas de Docker). Va acá, adentro del
      # job `ci` y no en un job aparte, porque `ci` es el único check que exige
      # la protección de `main` (F0-06).
      - name: test:e2e
        if: ${{ !cancelled() && steps.navegador.outcome == 'success' && steps.imagen.outcome == 'success' }}
        run: npm run test:e2e

      # gitleaks (P14): segunda red detrás de push protection. Binario de un
      # release fijo, verificado contra su SHA-256 antes de ejecutarlo.
      - name: gitleaks (descarga verificada)
        id: gitleaks
        if: ${{ !cancelled() && steps.codigo.outcome == 'success' }}
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/$archivo" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archivo}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archivo" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archivo" -C "$RUNNER_TEMP" gitleaks

      # Qué commits se escanean:
      # - pull_request: los del PR (base..cabeza).
      # - push: los que trajo el push (antes..después). Si `before` no sirve
      #   (rama o tag nuevos, historia reescrita), lo que no está en la rama
      #   principal.
      # `--redact`: los logs de un repo público son públicos; el hallazgo se
      # informa sin el valor.
      - name: gitleaks (commits nuevos)
        if: ${{ !cancelled() && steps.gitleaks.outcome == 'success' }}
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          CABEZA_PR: ${{ github.event.pull_request.head.sha }}
          ANTES: ${{ github.event.before }}
          RAMA_PRINCIPAL: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then
            rango="${BASE_PR}..${CABEZA_PR}"
          elif [ -n "$ANTES" ] && git cat-file -e "${ANTES}^{commit}" 2>/dev/null; then
            rango="${ANTES}..${GITHUB_SHA}"
          else
            rango="origin/${RAMA_PRINCIPAL}..${GITHUB_SHA}"
          fi
          echo "Rango escaneado: ${rango}"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose \
            --log-opts="${rango}" .

  # Publicación de la imagen en GHCR (F0-07). Job aparte por los permisos: es
  # el único con `packages: write`; el resto del workflow sigue en solo
  # lectura. Corre **solo** en push a `main` y después de que `ci` esté en
  # verde, así que en un PR ni aparece: el check que exige F0-06 se llama `ci`
  # y sigue reflejando todo lo que corre en un PR (la imagen incluida, que se
  # construye y se prueba en el job `ci`).
  publicar:
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGEN: ghcr.io/${{ github.repository_owner }}/seism-gestion
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sin `cache: npm`: setup-node desaconseja su caché en un job con
      # permisos elevados, y acá no se instalan dependencias (el script de la
      # imagen corre con Node pelado y la app se compila adentro de la imagen).
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Las dos etiquetas del criterio: el SHA del commit y `latest`. La
      # versión que va a devolver `/api/salud` es el SHA corto, prefijo de la
      # primera.
      - name: imagen
        run: npm run imagen -- "$IMAGEN:$GITHUB_SHA" "$IMAGEN:latest"

      # No se publica una imagen que no levanta: las mismas verificaciones que
      # en `ci`, sobre la imagen que se va a empujar.
      - name: imagen:prueba
        run: npm run imagen:prueba -- "$IMAGEN:$GITHUB_SHA"

      - name: Entrar a GHCR
        env:
          TOKEN_GHCR: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN_GHCR" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publicar
        run: |
          docker push "$IMAGEN:$GITHUB_SHA"
          docker push "$IMAGEN:latest"

      # Retención (P8): se conservan las últimas 5 versiones del paquete, se
      # borran las más viejas. Con la API de GitHub y `gh` (ya viene en el
      # runner), sin acciones de terceros. Si el token no alcanzara, el paso
      # queda en rojo y el RUNBOOK (sección 15) dice qué hacer.
      - name: Retención en GHCR (últimas 5)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DUENO: ${{ github.repository_owner }}
          PAQUETE: seism-gestion
          CONSERVAR: "5"
        run: |
          set -euo pipefail
          versiones="$(gh api --paginate \
            "/users/${DUENO}/packages/container/${PAQUETE}/versions" \
            --jq '.[] | "\(.created_at) \(.id)"' | sort -r)"
          total="$(printf '%s\n' "$versiones" | grep -c . || true)"
          echo "Versiones en GHCR: ${total}. Se conservan las últimas ${CONSERVAR}."
          if [ "$total" -le "$CONSERVAR" ]; then
            echo "Nada que borrar."
            exit 0
          fi
          printf '%s\n' "$versiones" | tail -n "+$((CONSERVAR + 1))" | \
          while read -r fecha id; do
            echo "Borrando la versión ${id} (creada ${fecha})."
            gh api --method DELETE \
              "/users/${DUENO}/packages/container/${PAQUETE}/versions/${id}"
          done
