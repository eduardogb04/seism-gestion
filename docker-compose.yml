# Servicios locales de desarrollo (F0-08). Decisiones y porqués:
# docs/adr/0008-prisma-y-reversion.md y docs/convenciones-base.md.
#
# Hoy solo Postgres. MinIO (almacenamiento de documentos) llega en F0-27.
#
#   docker compose up -d      levanta la base (espera al healthcheck con --wait)
#   docker compose ps         tiene que decir "healthy"
#   docker compose down       la apaga; los datos quedan en el volumen
#   docker compose down -v    la apaga y BORRA el volumen (base vacía)
#
# Las credenciales de acá son de desarrollo local, ficticias y descartables:
# el contenedor solo escucha en 127.0.0.1 y no guarda nada real. Son las
# mismas que trae DATABASE_URL en .env.example. No son secretos (ver
# .gitleaks.toml si gitleaks las marcara).

name: seism-gestion

services:
  postgres:
    # Postgres 16 (criterio de F0-08), fijado por tag y digest como la base
    # del Dockerfile (ADR 0006 y 0007): un tag se mueve, un digest no. Se sube
    # a mano: cambiar tag y digest juntos (`docker pull postgres:16.N-alpine`
    # imprime el digest).
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: seism
      POSTGRES_PASSWORD: seism_local
      POSTGRES_DB: seism_gestion
    ports:
      # Solo en la máquina local: no se expone a la red.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql/data
    healthcheck:
      # Sano = acepta conexiones en la base de la app, no solo "el proceso
      # existe".
      test: ["CMD-SHELL", "pg_isready --username=seism --dbname=seism_gestion"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # La app, solo para el e2e (F0-14). Vive detrás del perfil `e2e`: no la
  # levanta `docker compose up -d`, solo `npm run test:e2e` (que la levanta con
  # `scripts/e2e-app.ts` y la apaga al terminar). Corre **la imagen que se
  # publica** (`seism-gestion:local`, la que construye `npm run imagen`), no
  # `next dev`: el e2e prueba lo que se despliega.
  #
  # Desde F0-31 la app se conecta a la base (el login y la sesión): usa la
  # `postgres-e2e` de abajo, no la de desarrollo. Entra con la identidad falsa
  # (`IDENTIDAD=falsa`, que el esquema acepta con `APP_ENTORNO=local`).
  app:
    profiles: ["e2e"]
    image: seism-gestion:local
    environment:
      APP_ENTORNO: local
      DATABASE_URL: postgresql://seism:seism_local@postgres-e2e:5432/seism_gestion
      # Obligatoria desde F0-30; inventada, como todo lo de este servicio. Es
      # el administrador que `db:seed` da de alta y con el que entra el e2e.
      ADMIN_INICIAL_EMAIL: admin@ejemplo.test
      IDENTIDAD: falsa
    depends_on:
      postgres-e2e:
        condition: service_healthy
    ports:
      # Solo en la máquina local, como el Postgres de arriba.
      - "127.0.0.1:3000:3000"

  # La base del e2e (F0-31): descartable, sin volumen con nombre, y con el
  # puerto de la máquina elegido por Docker (`127.0.0.1::5432`), así no choca
  # con el Postgres de desarrollo ni con el `services: postgres` de CI.
  # `scripts/e2e-app.ts` la levanta, le pregunta el puerto
  # (`docker compose port`), la migra y la siembra antes de levantar la app;
  # `tests/e2e/_arnes/apagar-app.ts` la borra con sus datos al terminar.
  postgres-e2e:
    profiles: ["e2e"]
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: seism
      POSTGRES_PASSWORD: seism_local
      POSTGRES_DB: seism_gestion
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # Por TCP (`--host`): mientras la imagen inicializa la base, el servidor
      # provisorio solo escucha en el socket, y no tiene que contar como sano.
      test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --username=seism --dbname=seism_gestion"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-datos:
